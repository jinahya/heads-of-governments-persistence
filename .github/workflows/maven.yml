# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "develop", "main", "sketch" ]
  pull_request:
    branches: [ "develop", "main", "sketch" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      # submodules are deliberately NOT fetched: db-sample-schemas carries the install
      # scripts for a live database and nothing in the Maven build reads it.
    # The build JDK, not the target. Main sources are compiled with --release 21 (see
    # maven.compiler.release) so the artifacts stay usable on 21; the TEST sources are
    # compiled with --release 25 (maven.compiler.testRelease), which a JDK 21 javac cannot
    # do -- it fails with "release version 25 not supported". Keep this in step with
    # the enforcer's requireJavaVersion bound in the root pom.
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    # `verify`, not `package`: it runs everything bound up to and including verify -- the unit
    # tests against each module's <module>-test persistence unit (H2, in-memory, schema generated
    # from the mappings), jacoco and the licence check -- so a green run here means that path is
    # verified end to end.
    #
    # The <module>-it integration tests are NOT run, and cannot be: maven-failsafe-plugin is declared
    # only inside the `failsafe` profile, so `verify` without -Pfailsafe never reaches an *_IT
    # class. Those need the Oracle database from docker-compose.yml, with the sample schemas
    # installed; see the `integration` job note below.
    - name: Verify with Maven
      run: mvn -B verify --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v4

  # One cell per Jakarta EE generation. Hibernate ORM is the only persistence provider, so the
  # generation is the only thing worth varying; jakarta-ee-11 is the only one so far, and a new
  # generation is a new profile and a new cell here.
  #
  # Naming any profile on the command line deactivates every activeByDefault profile, which is fine:
  # the cell names the generation it wants.
  #
  # `test`, not `verify`: compiling, converging and passing the tests are all settled by the end of
  # the test phase, and the `build` job above runs the full `verify` once.
  #
  # No *_IT class is reachable here: maven-failsafe-plugin is declared only inside the `failsafe`
  # profile, which no cell names.
  jakarta-ee:

    runs-on: ubuntu-latest

    strategy:
      # one broken generation should not hide the state of another
      fail-fast: false
      matrix:
        profile:
          - jakarta-ee-11

    name: ${{ matrix.profile }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Test
      run: >
        mvn -B test
        -P${{ matrix.profile }}
